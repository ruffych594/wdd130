<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Rush Rafting</title>
    <meta name="description"
      content="Contact Rapid Rush Rafting for reservations, general inquiries, trip information, and customer support">
    <meta name="author" content="Rufaro Chirume">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>

        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>
    <main>


        <!-- Company Information -->
        <section class="company-info">
            <h2>Rapid Rush Rafting Company</h2>

            <p>123 River Road</p>
            <p>Waterfall, South Africa</p>
            <p>+27 73 168 5390</p>
            <p>info@rapidrushrafting.com</p>
        </section>

        <!-- Map and Contact Form -->
        <section class="contact-grid">

            <div class="map">

                <iframe title="Rapid Rush Rafting Location"
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d142372.09725065244!2d31.047725388159222!3d-22.354022994005177!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sza!4v1785425711688!5m2!1sen!2sza"
                  loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

            <div class="contact-form">

                <form action="#" method="post">

                    <div class="form-row">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-row">
                        <label>Purpose Message:</label>

                        <div class="radio-group">
                            <label><input type="radio" name="purpose" value="general"> General
                                Inquiry</label>

                            <div class="middle-row">
                                <label><input type="radio" name="purpose" value="reservation">
                                    Reservation Question</label>

                            </div>

                            <label><input type="radio" name="purpose" value="website"> Website
                                Suggestion</label>
                        </div>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <label class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>


                    <button type="submit">Send My Message</button>

                </form>

            </div>

        </section>

        <!-- Team -->
        <section class="employees-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employees">

                <figure>
                    <img src="images/guide1.webp" alt="John Smith River Guide">
                    <figcaption>John Smith<br>Senior River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/guide2.webp" alt="Sarah Brown Reservations Manager">
                    <figcaption>Sarah Brown<br>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/guide3.webp" alt="Anna Davis Safety Coordinator">
                    <figcaption>Anna Davis<br>Safety Coordinator</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Rapid Rush Rafting | Rufaro Chirume
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener">
                <img src="images/twitter.png" alt="Twitter icon">
            </a>

            <a href=" https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.png" alt="Instagram icon">
            </a>

        </nav>

    </footer>

</body>

</html>
